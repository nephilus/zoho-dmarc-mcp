{{- $digest := required "image.digest must be a pinned sha256 digest" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) -}}
{{- fail "image.digest must be sha256 followed by 64 lowercase hex characters" -}}
{{- end -}}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.tunnel.image) -}}
{{- fail "tunnel.image must be pinned by digest" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}@{{ $digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, zoho_dmarc, collector]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - name: ZOHO_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.zoho.secretName }}, key: client_id}}
            - name: ZOHO_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.zoho.secretName }}, key: client_secret}}
            - name: ZOHO_REFRESH_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.zoho.secretName }}, key: refresh_token}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: collector-tmp, mountPath: /tmp}
          startupProbe:
            exec: {command: [python, -m, zoho_dmarc, probe]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [python, -m, zoho_dmarc, probe]}
            periodSeconds: 30
          livenessProbe:
            exec: {command: [python, -m, zoho_dmarc, probe]}
            periodSeconds: 60
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.collector | nindent 12 }}
        - name: server
          image: "{{ .Values.image.repository }}@{{ $digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, zoho_dmarc, server]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: DMARC_REMEDIATION, value: {{ .Values.config.remediationUtc | quote }}}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: server-tmp, mountPath: /tmp}
          startupProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
        - name: tunnel
          image: {{ .Values.tunnel.image | quote }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - name: CONTROL_PLANE_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.tunnel.secretName }}, key: api_key}}
            - name: CONTROL_PLANE_TUNNEL_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.tunnel.secretName }}, key: tunnel_id}}
            - {name: MCP_SERVER_URL, value: "http://127.0.0.1:8000/mcp"}
            - {name: MCP_STARTUP_WAIT_TIMEOUT, value: "300s"}
            - {name: HEALTH_LISTEN_ADDR, value: ":8080"}
            - {name: LOG_FORMAT, value: json}
            - {name: LOG_LEVEL, value: warn}
          startupProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.tunnel | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" .Release.Name) .Values.persistence.existingClaim }}
        - name: config
          secret:
            secretName: {{ .Values.config.secretName }}
            defaultMode: 0440
        - name: collector-tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: server-tmp
          emptyDir: {sizeLimit: 32Mi}
