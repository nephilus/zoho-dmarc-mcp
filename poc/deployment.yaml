apiVersion: v1
kind: Namespace
metadata:
  name: zoho-dmarc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoho-dmarc-proof
  namespace: zoho-dmarc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zoho-dmarc-proof
  template:
    metadata:
      labels:
        app: zoho-dmarc-proof
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: PROOF_IMAGE
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        - name: tunnel
          image: ghcr.io/openai/tunnel-client@sha256:119799b778ba8411a124f53588f9dc837fd62ba03e5fadf77d675123c92ab58e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: CONTROL_PLANE_TUNNEL_ID
              valueFrom:
                secretKeyRef: {name: openai-tunnel, key: tunnel_id}
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef: {name: openai-tunnel, key: api_key}
            - {name: MCP_SERVER_URL, value: "http://127.0.0.1:8000/mcp"}
            - {name: MCP_STARTUP_WAIT_TIMEOUT, value: "60s"}
            - {name: HEALTH_LISTEN_ADDR, value: ":8080"}
            - {name: LOG_FORMAT, value: json}
            - {name: LOG_LEVEL, value: warn}
          ports:
            - {name: health, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
